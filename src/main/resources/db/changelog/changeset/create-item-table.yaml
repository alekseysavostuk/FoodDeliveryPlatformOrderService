databaseChangeLog:
  - changeSet:
      id: create_item_table
      author: Aleksey
      changes:
        - createTable:
            tableName: order_item
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(8, 2)
                  constraints:
                    nullable: false
              - column:
                  name: dish_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: order_item
            baseColumnNames: order_id
            constraintName: fk_order_item_order
            referencedTableName: orders
            referencedColumnNames: id
        - createIndex:
            indexName: idx_order_item_order_id
            tableName: order_item
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_order_item_dish_id
            tableName: order_item
            columns:
              - column:
                  name: dish_id
        - createIndex:
            indexName: idx_order_item_order_dish
            tableName: order_item
            columns:
              - column:
                  name: order_id
              - column:
                  name: dish_id
        - createIndex:
            indexName: idx_order_item_price
            tableName: order_item
            columns:
              - column:
                  name: price