databaseChangeLog:
  - changeSet:
      id: create_payment_table
      author: Aleksey
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: method
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
        - addForeignKeyConstraint:
            baseTableName: payment
            baseColumnNames: order_id
            constraintName: fk_payment_order
            referencedTableName: orders
            referencedColumnNames: id
        - createIndex:
            indexName: idx_payment_order_id
            tableName: payment
            columns:
              - column:
                  name: order_id